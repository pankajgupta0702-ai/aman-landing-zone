name: "Terraform Azure CI/CD Pipeline"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**' # Agar terraform files kisi specific folder me hain toh path de do, warna hata sakte ho
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Pipeline"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform # Agar root me hi .tf files hain toh is line ko hata dena

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (PR Stage)
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform Apply (Merge / Approval Stage)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false